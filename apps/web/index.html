<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordUp — Learn English Vocabulary</title>
  <!-- apply the saved theme before anything is drawn (no flash of the default theme) -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("wordup-settings-v1") || "{}");
      document.documentElement.dataset.theme = s.theme || "midnight";
      document.documentElement.lang = s.lang || "ru";
    } catch (e) { document.documentElement.dataset.theme = "midnight"; }
  </script>
  <!-- open connections early: API, icons fallback CDN, fonts -->
  <link rel="preconnect" href="https://wordup-api.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <!-- Telegram Mini App bridge (no-op when opened as a normal website) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
